name: 🚀 Deploy frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: 🚀 Deploy to production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Github Action
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: 🟢 Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: 📦 Install pnpm
        run: npm install --global pnpm@12.14.0
      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile
      - name: 🕒 Get workflow start time
        id: build-info
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! started_at="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" --jq '.run_started_at // empty')" ||
             [[ -z "$started_at" ]] ||
             ! version="$(TZ=CST-8 date --date="$started_at" +%y%m%d%H%M%S)"; then
            echo '::warning::Unable to read the workflow start time. The build number will be hidden.'
            exit 0
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: ✅ Check and build
        env:
          VITE_BUILD_VERSION: ${{ steps.build-info.outputs.version }}
          VITE_BUILD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: pnpm check
      - name: 🔐 Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [[ -z "$DEPLOY_KEY" || -z "$KNOWN_HOSTS" ]]; then
            echo '::error::Set DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS in the Github Action environment secrets.'
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
      - name: 🚀 Upload and activate release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]; then
            echo '::error::DEPLOY_HOST must be a hostname or IPv4 address without a port or extra whitespace.'
            exit 1
          fi
          if [[ ! "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*[$]?$ ]]; then
            echo '::error::DEPLOY_USER must be a valid lowercase Linux username without extra whitespace.'
            exit 1
          fi
          if [[ ! "$RELEASE_ID" =~ ^[0-9]+-[0-9]+$ ]]; then
            echo '::error::Invalid GitHub Actions release identifier.'
            exit 1
          fi
          ssh_args=(-i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -l "$DEPLOY_USER" "$DEPLOY_HOST")
          tar -C dist -czf "$RUNNER_TEMP/frontend.tar.gz" .
          ssh "${ssh_args[@]}" "mkdir -p /var/www/maki-frontend/releases/$RELEASE_ID"
          ssh "${ssh_args[@]}" "tar -xzf - -C /var/www/maki-frontend/releases/$RELEASE_ID" < "$RUNNER_TEMP/frontend.tar.gz"
          ssh "${ssh_args[@]}" "bash -s -- '$RELEASE_ID'" <<'REMOTE'
          set -euo pipefail
          base=/var/www/maki-frontend
          release="$base/releases/$1"
          test -f "$release/index.html"
          if [ -e "$base/current" ] && [ ! -L "$base/current" ]; then
            echo 'current exists and is not a symlink; migrate it before deployment.' >&2
            exit 1
          fi
          ln -s "$release" "$base/.current-$1"
          mv -Tf "$base/.current-$1" "$base/current"
          REMOTE
